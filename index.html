<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0a0d14" />
    <title>LAST LINE</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #0a0d14;
        color: #e8eef7;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        -webkit-user-select: none;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
        overscroll-behavior: none;
        touch-action: none;
      }
      #game-root {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
      }
      #game-root canvas {
        display: block;
        touch-action: none;
      }
      #boot-splash {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        background: #0a0d14;
        z-index: 10;
        transition: opacity 220ms ease-out;
      }
      #boot-splash.hidden {
        opacity: 0;
        pointer-events: none;
      }
      #boot-splash .title {
        font-size: clamp(28px, 9vw, 56px);
        font-weight: 800;
        letter-spacing: 0.22em;
        color: #f2f6ff;
      }
      #boot-splash .bar {
        width: min(220px, 55vw);
        height: 4px;
        border-radius: 2px;
        background: #1c2434;
        overflow: hidden;
      }
      #boot-splash .bar > i {
        display: block;
        width: 40%;
        height: 100%;
        border-radius: 2px;
        background: #7fd4a2;
        animation: slide 1.1s ease-in-out infinite;
      }
      @keyframes slide {
        0% {
          transform: translateX(-100%);
        }
        100% {
          transform: translateX(250%);
        }
      }
    </style>
    <!--
      The YouTube Playables SDK MUST be loaded before any game code.
      This is the only permitted external request; everything else is bundled.
    -->
    <script src="https://www.youtube.com/game_api/v1"></script>
  </head>
  <body>
    <div id="game-root"></div>
    <div id="boot-splash">
      <div class="title">LAST LINE</div>
      <div class="bar"><i></i></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
